name: Sync Halo skills

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-halo-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare skills and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install publishing dependencies once
        run: npm ci --prefix "halo-skill-publishing" --ignore-scripts --no-audit --no-fund
      - run: node "halo-skill-publishing/prepare-halo-skills.mjs" .halo-skills
      - name: Upload prepared skills
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halo-skills
          path: .halo-skills/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Verify skill commands are available
        run: node "halo-skill-publishing/node_modules/@langfuse/cli/bin/langfuse.mjs" skills push --help
      - name: Upload Langfuse CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halo-cli
          path: halo-skill-publishing/node_modules/@langfuse/cli/
          if-no-files-found: error
          retention-days: 2

  publish-staging:
    name: Publish STAGING
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish-halo-skills
        with:
          base-url: https://staging.langfuse.com
          public-key: ${{ secrets.LANGFUSE_AI_FEATURES_STAGING_PUBLIC_KEY }}
          secret-key: ${{ secrets.LANGFUSE_AI_FEATURES_STAGING_SECRET_KEY }}

  publish-eu:
    name: Publish EU
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish-halo-skills
        with:
          base-url: https://cloud.langfuse.com
          public-key: ${{ secrets.LANGFUSE_AI_FEATURES_EU_PUBLIC_KEY }}
          secret-key: ${{ secrets.LANGFUSE_AI_FEATURES_EU_SECRET_KEY }}

  publish-us:
    name: Publish US
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish-halo-skills
        with:
          base-url: https://us.cloud.langfuse.com
          public-key: ${{ secrets.LANGFUSE_AI_FEATURES_US_PUBLIC_KEY }}
          secret-key: ${{ secrets.LANGFUSE_AI_FEATURES_US_SECRET_KEY }}

  publish-jp:
    name: Publish JP
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish-halo-skills
        with:
          base-url: https://jp.cloud.langfuse.com
          public-key: ${{ secrets.LANGFUSE_AI_FEATURES_JP_PUBLIC_KEY }}
          secret-key: ${{ secrets.LANGFUSE_AI_FEATURES_JP_SECRET_KEY }}

  publish-hipaa:
    name: Publish HIPAA
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish-halo-skills
        with:
          base-url: https://hipaa.cloud.langfuse.com
          public-key: ${{ secrets.LANGFUSE_AI_FEATURES_HIPAA_PUBLIC_KEY }}
          secret-key: ${{ secrets.LANGFUSE_AI_FEATURES_HIPAA_SECRET_KEY }}
