name: Publish Halo skills
description: Publish prepared skills using the shared Langfuse CLI artifact
inputs:
  base-url:
    description: Langfuse instance URL
    required: true
  public-key:
    description: AI-features project public key
    required: true
  secret-key:
    description: AI-features project secret key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Download prepared skills
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: halo-skills
        path: .halo-skills
    - name: Download Langfuse CLI
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: halo-cli
        path: ${{ runner.temp }}/halo-cli
    - name: Push skills and apply the Halo tag
      shell: bash
      env:
        LANGFUSE_BASE_URL: ${{ inputs.base-url }}
        LANGFUSE_PUBLIC_KEY: ${{ inputs.public-key }}
        LANGFUSE_SECRET_KEY: ${{ inputs.secret-key }}
        CLI_JS: ${{ runner.temp }}/halo-cli/bin/langfuse.mjs
      run: |
        set -euo pipefail
        node "$CLI_JS" skills push .halo-skills \
          --recursive --no-lockfile --label production \
          --commit-message "Sync Halo skills from langfuse/skills@$GITHUB_SHA" \
          --json > "$RUNNER_TEMP/halo-pushed.json"
        # Fail on empty or skipped results.
        jq -e 'length > 0 and all(.[]; .status == "created" or .status == "unchanged" or .status == "labeled")' \
          "$RUNNER_TEMP/halo-pushed.json" > /dev/null

        # Print each skill's publishing result.
        jq -r '.[] | "\(.status): \(.name)@\(.version)"' "$RUNNER_TEMP/halo-pushed.json"

        # Add the Halo tag without removing existing tags.
        jq -r '.[].name' "$RUNNER_TEMP/halo-pushed.json" > "$RUNNER_TEMP/halo-skill-names.txt"

        while IFS= read -r skill_name; do
          current_tags="$(node "$CLI_JS" api skills get "$skill_name" --label production --json | jq '.body.tags')"
          has_halo_tag="$(jq 'index("in-app-agent") != null' <<< "$current_tags")"
          if [[ "$has_halo_tag" == "true" ]]; then
            continue
          fi

          update_body="$(jq -c '{tags: (. + ["in-app-agent"])}' <<< "$current_tags")"
          node "$CLI_JS" api skills update "$skill_name" --body-json "$update_body" --json > /dev/null
        done < "$RUNNER_TEMP/halo-skill-names.txt"
